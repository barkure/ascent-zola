{% if current_path is defined and (current_path is starting_with(pat="/archives") or current_path is starting_with(pat="/tags") or current_path is starting_with(pat="/categories")) %}
<script type="text/javascript">
let tgl=(s)=>{x=document.getElementsByName("expand");for(let i=0;i<x.length;i++)x[i].checked=s.checked;}
</script>
{% endif %}

{% if config.extra.settings %}
<div id="settings-container">
  <div id="dark-mode">dark</div>
</div>
<script type="text/javascript">
(() => {
  const rootStyle = document.documentElement.style;
  const storage = localStorage;
  const darkButton = document.getElementById("dark-mode");
  // Keep the existing stored values: 1 = enabled, 2 = disabled.
  const savedMode = storage.getItem("s");
  let dark = savedMode ? savedMode === "1" :
    Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const palettes = {
    light: {
      "bg-color": "#fafafa", "code-bg-color": "#f4f4f4",
      "text-color": "#212121", "secondary-color": "#808080",
      "tertiary-color": "#b0b0b0", "link-color": "#b5c8cf",
      "link-hover-color": "#618794", "link-bg-color": "#dae4e7",
      "selection-color": "#dae4e7",
    },
    dark: {
      "bg-color": "#212121", "code-bg-color": "#292929",
      "text-color": "#fff", "secondary-color": "#c0c0c0",
      "tertiary-color": "#6e6e6e", "link-color": "#4d6b75",
      "link-hover-color": "#96b1bb", "link-bg-color": "#5d828e",
      "selection-color": "#acc1c9",
    },
  };
  function applyMode() {
    for (const [name, value] of Object.entries(palettes[dark ? "dark" : "light"])) {
      rootStyle.setProperty(`--${name}`, value);
    }
    darkButton.textContent = dark ? "light" : "dark";
  }
  darkButton.onclick = () => {
    dark = !dark;
    storage.setItem("s", dark ? "1" : "2");
    applyMode();
  };
  applyMode();

})();
</script>
{% endif %}
