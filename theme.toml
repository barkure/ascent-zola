# Ascent — a 1:1 Zola port of cjquines/hexo-theme-ascent
name = "ascent"
license = "MIT"
description = "An opinionated theme for blogs with long blocks of text: magazine-like typography, a serif/sans toggle, a light/dark toggle and month-grouped archives."
homepage = "https://github.com/barkure/ascent-zola"
author = "Barkure (port); design and CSS by CJ Quines"
min_version = "0.23.0"

# Every key below is a default: override it in your site's `zola.toml` under
# [extra] to change it.
[extra]

# ---------------------------------------------------------------- site chrome
# Path to your favicon, relative to the site root. The theme ships none;
# put your own file in the site's static/ and point to it here.
favicon = ""

# Header links, rendered with the theme's "×" separators.
# URLs starting with http:// or https:// get target="_blank" rel="noopener",
# which is what the original Hexo theme did for every external link.
menu = [
  { name = "Home", url = "/" },
  { name = "Archives", url = "/archives" },
]

# Show the lower-right toggles: the dark-mode one, plus the serif ⇄ sans one
# below when `sans_toggle` is on.
settings = true

# Show the serif ⇄ sans toggle next to the dark-mode toggle. It swaps
# --body-stack between `body_stack` and `sans_stack` (see the fonts section),
# so turn it off for a site that only ships one of the two.
sans_toggle = true

# Load css/highlight.css (highlight.js palette shipped with the original theme).
highlight = true

# Label of the "read more" link on listings; set to "" to hide the link.
excerpt_link = "read more"

# Feed path for the header link, e.g. "/atom.xml"; "" hides the link.
# The feed itself is generated by Zola's `generate_feeds`.
rss = ""

# Show "N words × M minutes" next to the date.
word_count = false

# ---------------------------------------------------------------------- fonts
# Stylesheet(s) holding the @font-face rules: a single URL, or a list of URLs.
# The default is the original Hexo theme's four families, as one request instead
# of the original's two @imports. A leading "/" is resolved with get_url, so
# self-hosted stylesheets can be named as "css/whatever.css".
#
# Shipped as a site option partly so it can be re-pointed at a mirror, e.g. for
# readers in mainland China: https://fonts.googleapis.cn serves the same CSS but
# references the font files on fonts.gstatic.cn, so `fonts_preconnect` has to
# change with it. A family no webfont host carries (Maple Mono CN, for instance)
# can be added as a second entry pointing at a CDN or a self-hosted stylesheet.
# Set to "" to load no webfonts at all, and the stacks below fall through to
# their local families.
fonts_url = "https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display+SC:wght@400;900&family=Roboto+Mono&display=swap"

# Origins to <link rel="preconnect"> before the stylesheets, so the font CSS and
# the font files are discovered alongside the rest of the document. Add the
# font-file host as well whenever it differs from the stylesheet host (Google
# Fonts serves the two from different domains; npm CDNs serve both from one).
fonts_preconnect = ["https://fonts.googleapis.com", "https://fonts.gstatic.com"]

# The font stacks, written as raw CSS values: quote any family name containing a
# space, and keep the generic family last. They are injected as an inline
# <style> that overrides the :root defaults in css/style.css and
# css/highlight.css. `body_stack` is the body text, `title_stack` the site name
# and post titles, `secondary_stack` the sans-ish chrome (nav, dates, metadata),
# `highlight_stack` code and preformatted text.
body_stack = '"Lora", "Georgia", "Times New Roman", serif'
title_stack = '"Playfair Display SC", "Georgia", serif'
secondary_stack = '"Lato", "Lucida Grande", "Lucida Sans Unicode", "Lucida Sans", "Verdana", sans-serif'
highlight_stack = '"Roboto Mono", "Inconsolata", "Consolas", monospace'

# What the serif ⇄ sans toggle switches --body-stack to; only read when
# `sans_toggle` is on.
sans_stack = '"Lato", "Lucida Grande", "Lucida Sans Unicode", "Lucida Sans", "Verdana", sans-serif'

# ------------------------------------------------------------------- metadata
# Locale handed to Zola's `date` filter (BCP-47), e.g. "en", "zh-cn" (which
# reproduces moment.js-style "一月 20, 2026, 9:57 晚上"), "de", ...
date_locale = "en"

# Use moment.js' Chinese day periods (凌晨/早上/上午/中午/下午/晚上) instead of
# the locale's AM/PM marker. Only useful together with a zh-* date_locale.
cjk_meridiem = false

# Fallback og:image / twitter:image URL for pages that don't set
# `extra.og_image` in their front matter.
og_image = ""

# og:locale as written in the meta tag, e.g. "zh_CN". Defaults to
# default_language with a "_" separator.
og_locale = ""

# ------------------------------------------------------- optional integrations
# IntenseDebate comments (same as the original theme). Set the account key to
# enable; enabled blocks only render on post pages, as before.
intensedebate_acct = ""

# Google Analytics (Universal Analytics, as shipped in the original theme).
# Prefer a modern analytics snippet; kept for parity.
google_analytics_acct = ""

# ------------------------------------------------------------- mathjax loader
# Loaded on pages with `mathjax = true` in their [extra] front matter.
mathjax_url = "https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"
mathjax_config = '{tex: {inlineMath: [["$","$"],["\\(","\\)"]], displayMath: [["$$","$$"],["\\[","\\]"]]}, options: {enableMenu: false}}'
