# Ascent — a 1:1 Zola port of cjquines/hexo-theme-ascent
name = "ascent"
license = "MIT"
description = "An opinionated theme for blogs with long blocks of text: magazine-like typography, a serif/sans toggle, a light/dark toggle and month-grouped archives."
homepage = "https://github.com/barkure/ascent-zola"
author = "Barkure (port); design and CSS by CJ Quines"
min_version = "0.23.0"

# Every key below is a default: override it in your site's `zola.toml` under
# [extra] to change it.
[extra]

# ---------------------------------------------------------------- site chrome
# Path to your favicon, relative to the site root. The theme ships none;
# put your own file in the site's static/ and point to it here.
favicon = ""

# Header links, rendered with the theme's "×" separators.
# URLs starting with http:// or https:// get target="_blank" rel="noopener",
# which is what the original Hexo theme did for every external link.
menu = [
  { name = "Home", url = "/" },
  { name = "Archives", url = "/archives" },
]

# Show the "dark" / "sans" toggles in the lower-right corner.
settings = true

# Load css/highlight.css (highlight.js palette shipped with the original theme).
highlight = true

# Label of the "read more" link on listings; set to "" to hide the link.
excerpt_link = "read more"

# Feed path for the header link, e.g. "/atom.xml"; "" hides the link.
# The feed itself is generated by Zola's `generate_feeds`.
rss = ""

# Show "N words × M minutes" next to the date.
word_count = false

# ------------------------------------------------------------------- metadata
# Locale handed to Zola's `date` filter (BCP-47), e.g. "en", "zh-cn" (which
# reproduces moment.js-style "一月 20, 2026, 9:57 晚上"), "de", ...
date_locale = "en"

# Use moment.js' Chinese day periods (凌晨/早上/上午/中午/下午/晚上) instead of
# the locale's AM/PM marker. Only useful together with a zh-* date_locale.
cjk_meridiem = false

# Fallback og:image / twitter:image URL for pages that don't set
# `extra.og_image` in their front matter.
og_image = ""

# og:locale as written in the meta tag, e.g. "zh_CN". Defaults to
# default_language with a "_" separator.
og_locale = ""

# ------------------------------------------------------- optional integrations
# IntenseDebate comments (same as the original theme). Set the account key to
# enable; enabled blocks only render on post pages, as before.
intensedebate_acct = ""

# Google Analytics (Universal Analytics, as shipped in the original theme).
# Prefer a modern analytics snippet; kept for parity.
google_analytics_acct = ""

# ------------------------------------------------------------- mathjax loader
# Loaded on pages with `mathjax = true` in their [extra] front matter.
mathjax_url = "https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"
mathjax_config = '{tex: {inlineMath: [["$","$"],["\\(","\\)"]], displayMath: [["$$","$$"],["\\[","\\]"]]}, options: {enableMenu: false}}'
