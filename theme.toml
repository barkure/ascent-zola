# Ascent：Zola 博客主题
name = "ascent"
license = "MIT"
description = "An opinionated theme for blogs with long blocks of text: serif typography, dark mode and monthly archives."
homepage = "https://github.com/barkure/ascent-zola"
author = "Barkure (port); design and CSS by CJ Quines"
min_version = "0.23.0"

# 以下为主题默认配置，可在站点 zola.toml 的 [extra] 下覆盖。
[extra]

# 页面与导航
# 网站图标路径，例如 "/favicon.ico"，对应站点 static/favicon.ico。
# 留空则不设置图标。
favicon = ""

# 顶部导航链接，以“×”分隔；http:// 或 https:// 链接会在新标签页打开。
menu = [
  { name = "Home", url = "/" },
  { name = "Archives", url = "/archives" },
]

# 加载代码块样式和高亮配色。
highlight = true

# 文章列表中“阅读全文”链接的文字，留空则隐藏链接。
excerpt_link = "read more"

# 在日期旁显示字数和预计阅读时间。
word_count = false

# 日期与分享信息
# 日期语言，例如 "en"（英文）、"zh-cn"（简体中文）。
date_locale = "zh-cn"

# 使用凌晨、早上、上午、中午、下午、晚上表示时段，需搭配中文日期语言。
cjk_meridiem = false

# 默认分享预览图；文章中的 [extra].og_image 可覆盖此设置。
og_image = ""

# 分享信息的语言标识，例如 "zh_CN"；留空时根据站点 default_language 生成。
og_locale = ""

# 数学公式
# 仅在文章的 [extra] 中设置 mathjax = true 时加载。
mathjax_url = "https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"
mathjax_config = '{tex: {inlineMath: [["$","$"],["\\(","\\)"]], displayMath: [["$$","$$"],["\\[","\\]"]]}, options: {enableMenu: false}}'
